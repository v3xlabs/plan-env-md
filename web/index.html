<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- one file for both tab themes: the SVG carries its own
             prefers-color-scheme rule, so there is nothing to switch here -->
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <title>plan.env.md</title>
        <!-- before the first paint, so a dark reader never sees a light frame;
             src/theme.ts owns the key and keeps the class in step after this -->
        <script>
            const saved = localStorage.getItem('plan-env-md-theme');
            const isDark = saved === null
                ? matchMedia('(prefers-color-scheme: dark)').matches
                : saved === 'dark';

            document.documentElement.classList.toggle('dark', isDark);
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
