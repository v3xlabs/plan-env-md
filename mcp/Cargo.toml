[package]
name = "plan-env-md-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["multipart", "json", "rustls"] }
rmcp = { version = "3.1.3", features = ["server", "macros", "transport-io", "schemars"] }
rustls = "0.23"
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
