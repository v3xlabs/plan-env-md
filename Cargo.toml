[package]
name = "plan-env-md"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
getrandom = "0.3"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
poem = { version = "3", features = ["cookie"] }
poem-openapi = { version = "5", features = ["cookie", "scalar"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rust-embed = "8.12.0"

[dev-dependencies]
serde_json = "1"
